name: tests

on: [push, pull_request]

jobs:
  self-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kinematics (IK -> FK on all 64 squares)
        run: python src/kinematics.py | tee out.txt && grep -q "64/64 ok" out.txt
      - name: Servo conversion
        run: python src/servo_settings.py | tee out.txt && ! grep -q "WRONG" out.txt
